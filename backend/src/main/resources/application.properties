# API keys live in the repo-root .env (see .env.example). Spring does not read .env on its own, so import it.
# `mvn spring-boot:run` runs from backend/ (../.env); `java -jar` is usually run from the repo root (./.env).
# A real environment variable with the same name takes precedence.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

newsapi.key=${NewsAPIKey:}

# Max real NewsAPI calls per UTC day. The free tier allows 100; the spare covers manual testing and
# any mismatch between our counter and NewsAPI's own window. Cache hits don't count.
newsapi.daily-budget=90

# Repeat searches are served from memory. Free-tier articles are ~24h delayed, so an hour of staleness is harmless.
spring.cache.cache-names=articles
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=1h

# Show the reason from ResponseStatusException in the error body (handy while developing).
server.error.include-message=always
