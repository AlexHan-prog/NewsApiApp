# API keys live in the repo-root .env (see .env.example). Spring does not read .env on its own, so import it.
# `mvn spring-boot:run` runs from backend/ (../.env); `java -jar` is usually run from the repo root (./.env).
# A real environment variable with the same name takes precedence.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

newsapi.key=${NewsAPIKey:}

# Max real NewsAPI calls per UTC day. The free tier allows 100; the spare covers manual testing and
# any mismatch between our counter and NewsAPI's own window. Cache hits don't count.
newsapi.daily-budget=90

guardian.key=${theGuardianAPIKey:}

# Max real Guardian calls per UTC day. The developer key allows 500 (and 1 per second); same spare as above.
guardian.daily-budget=450

# Repeat searches are served from memory, one cache per provider. Free-tier articles are ~24h delayed, so an hour of
# staleness is harmless.
spring.cache.cache-names=articles,guardianArticles
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=1h

# Timeouts for calls to the news APIs. The read timeout is what frees a worker thread stuck on a hung upstream;
# search.provider-timeout is a backstop that stops a search waiting on a provider that keeps dribbling data.
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=10s
search.provider-timeout=15s

# Show the reason from ResponseStatusException in the error body (handy while developing).
server.error.include-message=always
